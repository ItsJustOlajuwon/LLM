# Training config for Stage 3: Samuel Fine-Tuning
# Goal: Develop Samuel's personality and identity

stage: samuel
learning_rate: 5.0e-05
min_learning_rate: 1.0e-06
weight_decay: 0.05
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
warmup_steps: 100
max_steps: 5000

batch_size: 16
gradient_accumulation_steps: 4

lr_schedule: cosine
log_interval: 10
eval_interval: 250
save_interval: 1000
eval_steps: 50

output_dir: outputs
checkpoint_dir: checkpoints/samuel

device: auto
dtype: float32
compile_model: false

# Resume from instruction stage
resume_from: checkpoints/instruction/best.pt

seed: 42
use_wandb: false
